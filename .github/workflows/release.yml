name: Release

# Push a tag like v1.0.0 to build, sign, (optionally) notarize and publish a GitHub Release.
#
# Optional repository secrets for a Developer ID signed + notarized build.
# Without them the app is ad-hoc signed (see README for first-launch steps).
#   MACOS_CERT_P12           base64 of a "Developer ID Application" .p12
#   MACOS_CERT_PASSWORD      password for that .p12
#   APPLE_ID                 Apple ID email used for notarization
#   APPLE_TEAM_ID            Team ID (e.g. ABCDE12345)
#   APPLE_APP_PASSWORD       app-specific password for that Apple ID

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Version from tag
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Unit tests
        run: swift test

      - name: Import Developer ID certificate
        if: env.MACOS_CERT_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          test -n "$IDENTITY"
          echo "SIGN_ID=$IDENTITY" >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build Clipster.app (universal)
        run: SIGN_ID="${SIGN_ID:--}" ./Scripts/build-app.sh

      - name: Package
        run: SIGN_ID="${SIGN_ID:--}" ./Scripts/package.sh "$VERSION"

      - name: Notarize & staple
        if: env.MACOS_CERT_P12 != '' && env.APPLE_ID != ''
        run: |
          xcrun notarytool submit "dist/Clipster-$VERSION.dmg" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "dist/Clipster-$VERSION.dmg"
          xcrun stapler staple build/Clipster.app
          rm -f "dist/Clipster-$VERSION.zip"
          ditto -c -k --sequesterRsrc --keepParent build/Clipster.app "dist/Clipster-$VERSION.zip"
          (cd dist && shasum -a 256 "Clipster-$VERSION.dmg" "Clipster-$VERSION.zip" > SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/releases/$TAG.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          elif [ -f "$NOTES" ]; then
            gh release create "$TAG" dist/* --title "Clipster $VERSION" --notes-file "$NOTES" --verify-tag
          else
            gh release create "$TAG" dist/* --title "Clipster $VERSION" --generate-notes --verify-tag
          fi
